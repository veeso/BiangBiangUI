name: iOS CI

on:
  push:
    branches: ["main"]
    paths: ["Sources/**", "Tests/**", "Examples/**", "Package.swift", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["Sources/**", "Tests/**", "Examples/**", "Package.swift", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftformat:
    name: SwiftFormat lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Lint
        run: swiftformat --lint ./Sources ./Tests ./Examples

  build-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 ships the current stable SDK; xcode-27 is the iOS 27 SDK image.
        runner: [macos-26, xcode-27]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select default Xcode
        run: |
          set -o pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Create iOS simulator
        id: sim
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          RUNTIME=$(xcrun simctl list runtimes --json \
            | jq -r --arg sdk "$SDK" '($sdk | split(".") | map(tonumber)) as $max
                     | [.runtimes[] | select(.isAvailable == true and (.identifier | contains("iOS")))
                        | select((.version | split(".") | map(tonumber)) <= $max)]
                     | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          echo "Using runtime $RUNTIME for SDK $SDK"
          DEVTYPE=$(xcrun simctl list devicetypes --json \
            | jq -r '[.devicetypes[] | select(.name | test("^iPhone [0-9]+$"))]
                     | sort_by(.name | capture("(?<n>[0-9]+)").n | tonumber) | last | .identifier')
          SIM_ID=$(xcrun simctl create ci-iphone "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$SIM_ID" || true
          echo "sim_id=$SIM_ID" >> "$GITHUB_OUTPUT"
      - name: Build & test (xcodebuild)
        env:
          SIM_ID: ${{ steps.sim.outputs.sim_id }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme BiangBiangUI \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify
